<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>医学综合 · 个人工作台</title>
<style>
:root{
  --primary:#1a4a3a; --primary-l:#2a6e52; --primary-ll:#e8f2ee;
  --bg:#f5f7f6; --card:#fff; --line:#e2e8e5; --text:#1f2d28; --muted:#6b7d76;
  --danger:#c62828; --warn:#b8860b; --ok:#2e7d32; --info:#1565c0;
  --radius:10px; --shadow:0 1px 3px rgba(26,74,58,.08),0 4px 16px rgba(26,74,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
}
/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:58px;z-index:100;
  background:var(--primary);color:#fff;display:flex;align-items:center;
  padding:0 20px;gap:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.brand{font-size:16px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.brand small{font-weight:400;opacity:.7;font-size:12px;margin-left:6px}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tabs button{
  background:transparent;border:0;color:rgba(255,255,255,.78);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;
  white-space:nowrap;font-family:inherit;transition:.15s;
}
.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
.tabs button.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.status-pill{
  font-size:12px;padding:5px 12px;border-radius:20px;
  background:rgba(255,255,255,.15);white-space:nowrap;cursor:pointer;
}
.status-pill.ok{background:rgba(76,175,80,.3)}
.status-pill.bad{background:rgba(198,40,40,.45)}
/* ---------- 布局 ---------- */
main{max-width:1280px;margin:58px auto 60px;padding:22px 20px}
.tab{display:none}
.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-size:16px;margin:0 0 12px;color:var(--primary);font-weight:600;
  display:flex;align-items:center;gap:8px}
h2.sec .sub{font-size:12px;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.grid{display:grid;gap:14px}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
/* ---------- 库卡片 ---------- */
.lib{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.lib h3{font-size:14.5px;color:var(--primary);font-weight:600}
.lib .num{font-size:24px;font-weight:700;color:var(--primary-l);line-height:1.1}
.lib .num span{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.lib .meta{font-size:12px;color:var(--muted)}
.lib .acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
/* ---------- 按钮 ---------- */
button.btn{
  font-family:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;
  transition:.15s;white-space:nowrap;
}
button.btn:hover{border-color:var(--primary-l);color:var(--primary-l);background:var(--primary-ll)}
button.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
button.btn.pri:hover{background:var(--primary-l);border-color:var(--primary-l);color:#fff}
button.btn.dan{color:var(--danger);border-color:#f0c8c8}
button.btn.dan:hover{background:#fdeaea;border-color:var(--danger)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.sm{padding:3px 9px;font-size:12px}
/* ---------- 表单 ---------- */
input[type=text],input[type=search],select,textarea{
  font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--text);outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary-l);box-shadow:0 0 0 3px rgba(42,110,82,.1)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{display:flex;flex-direction:column}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--primary-ll);color:var(--primary);font-weight:600;
  position:sticky;top:0;font-size:12.5px;z-index:1}
tbody tr:hover{background:#fafcfb}
td.mono{font-family:Consolas,Monaco,monospace;font-size:12px;color:var(--muted)}
.table-wrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
/* ---------- 徽章 ---------- */
.badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:#eef2f1;color:var(--muted);white-space:nowrap}
.badge.ok{background:#e6f4ea;color:var(--ok)}
.badge.warn{background:#fdf3e0;color:var(--warn)}
.badge.bad{background:#fdeaea;color:var(--danger)}
.badge.info{background:#e6f0fa;color:var(--info)}
/* ---------- 检索结果 ---------- */
.res{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:#fff}
.res .rh{padding:9px 14px;background:var(--primary-ll);display:flex;
  justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.res .rh b{font-size:13px;color:var(--primary);word-break:break-all}
.res .rb{padding:12px 14px;display:none}
.res.open .rb{display:block}
.hit{margin-bottom:12px;padding-left:10px;border-left:3px solid var(--primary-ll)}
.hit .hl{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.hit pre{font-family:Consolas,Monaco,"Microsoft YaHei",monospace;font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;line-height:1.65;color:#2a3a34;
  background:#fafcfb;padding:8px 10px;border-radius:6px;margin:0}
mark{background:#fff3a8;padding:0 2px;border-radius:2px}
/* ---------- 任务卡 ---------- */
.task{border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.task .th{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.task .th b{font-size:14.5px;color:var(--primary)}
.task .tmeta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.task .tacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
/* ---------- 拖拽区 ---------- */
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:26px;
  text-align:center;color:var(--muted);cursor:pointer;transition:.18s;background:#fbfdfc}
.drop:hover,.drop.over{border-color:var(--primary-l);background:var(--primary-ll);color:var(--primary)}
.drop b{display:block;font-size:14px;margin-bottom:5px;color:var(--text)}
.drop .files{font-size:12px;margin-top:10px;text-align:left;color:var(--primary)}
/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(20,35,30,.5);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:860px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.28)}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.modal .mh b{font-size:15px;color:var(--primary)}
.modal .mb{padding:18px 20px;overflow:auto;flex:1}
.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;
  justify-content:flex-end;gap:9px;flex-wrap:wrap}
pre.code{font-family:Consolas,Monaco,monospace;font-size:12.5px;background:#f7f9f8;
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  white-space:pre-wrap;word-break:break-word;max-height:52vh;overflow:auto;line-height:1.6}
pre.log{font-family:Consolas,Monaco,monospace;font-size:12px;background:#1e2a26;color:#c8e6c9;
  border-radius:8px;padding:12px;white-space:pre-wrap;max-height:44vh;overflow:auto}
/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--primary);color:#fff;padding:11px 22px;border-radius:24px;
  font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.24);z-index:300;
  opacity:0;transition:.28s;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}
#toast.ok{background:var(--ok)}
/* ---------- 其他 ---------- */
.empty{text-align:center;color:var(--muted);padding:34px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.hint code{background:#eef2f1;padding:1px 5px;border-radius:4px;font-size:12px;
  font-family:Consolas,Monaco,monospace}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pager{display:flex;gap:7px;align-items:center;justify-content:center;margin-top:13px;font-size:12.5px;color:var(--muted)}
.guide-item{border:1px solid var(--line);border-radius:var(--radius);padding:15px;
  background:#fff;box-shadow:var(--shadow)}
.guide-item h4{font-size:14px;color:var(--primary);margin-bottom:7px}
.guide-item .eg{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.guide-item .eg em{color:var(--primary-l);font-style:normal;background:var(--primary-ll);
  padding:1px 6px;border-radius:4px;display:inline-block;margin:2px 3px 2px 0}
.warnbox{background:#fdf3e0;border-left:4px solid var(--warn);padding:11px 14px;
  border-radius:6px;font-size:12.5px;color:#7a5c0a;margin-bottom:14px}
@media(max-width:720px){
  .topbar{height:auto;flex-wrap:wrap;padding:9px 12px;gap:9px}
  main{margin-top:104px;padding:14px}
  .tabs button{padding:6px 10px;font-size:12.5px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">医学综合 · 工作台<small>yixue-zonghe</small></div>
  <nav class="tabs">
    <button data-tab="overview" class="active">概览</button>
    <button data-tab="textbooks">教材库</button>
    <button data-tab="search">跨库检索</button>
    <button data-tab="outputs">技能产物</button>
    <button data-tab="experts">专家体系</button>
    <button data-tab="guide">功能导航</button>
  </nav>
  <div class="status-pill" id="statusPill" onclick="refreshStatus(true)">检查中…</div>
</header>

<main>
  <section id="tab-overview" class="tab active"></section>
  <section id="tab-textbooks" class="tab"></section>
  <section id="tab-search" class="tab"></section>
  <section id="tab-outputs" class="tab"></section>
  <section id="tab-experts" class="tab"></section>
  <section id="tab-guide" class="tab"></section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <div class="mh"><b id="modalTitle">标题</b>
      <button class="btn sm" onclick="closeModal()">关闭</button></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" id="modalFoot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   基础工具
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.className = type; }, 3200);
}

function esc(s) {
  return String(s==null?'':s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(n) {
  n = Number(n||0);
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n/1024).toFixed(1) + 'KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + 'MB';
  return (n/1073741824).toFixed(2) + 'GB';
}

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  let j;
  try { j = await r.json(); }
  catch(e) { throw new Error('响应解析失败 HTTP ' + r.status); }
  if (!j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j.data;
}

const API = {
  overview:   ()        => api('/api/overview'),
  status:     ()        => api('/api/status'),
  textbooks:  (p)       => api('/api/textbooks?' + new URLSearchParams(p)),
  search:     (p)       => api('/api/search?' + new URLSearchParams(p)),
  experts:    ()        => api('/api/experts'),
  file:       (p)       => api('/api/file?' + new URLSearchParams(p)),
  task:       (id)      => api('/api/task?id=' + encodeURIComponent(id)),
  dTasks:     ()        => api('/api/distill/tasks'),
  dPrompt:    (slug)    => api('/api/distill/prompt?task=' + encodeURIComponent(slug)),
  dCheck:     (slug)    => api('/api/distill/check', {method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({slug})}),
  dQuality:   (slug)    => api('/api/distill/quality', {method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({slug})}),
  dInstall:   (slug)    => api('/api/distill/install', {method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({slug})}),
  rebuild:    (track)   => api('/api/rebuild-index', {method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({track})}),
  sync:       (body)    => api('/api/sync', {method:'POST',
                            headers:{'Content-Type':'application/json'},
                            body: JSON.stringify(body)}),
  extractSXM: ()        => api('/api/extract-shixuemin', {method:'POST'}),
  del:        (path)    => api('/api/delete?path=' + encodeURIComponent(path) + '&confirm=1',
                            {method:'DELETE'}),
  delTask:    (slug)    => api('/api/distill/task?task=' + encodeURIComponent(slug) + '&confirm=1',
                            {method:'DELETE'}),
};

function openModal(title, bodyHtml, footHtml='') {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFoot').innerHTML = footHtml;
  $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); }

/* ============================================================
   顶栏状态
   ============================================================ */
let STATUS = null;

async function refreshStatus(showDetail) {
  const pill = $('#statusPill');
  try {
    STATUS = await API.status();
    if (STATUS.all_ok) {
      pill.className = 'status-pill ok';
      pill.textContent = '✅ 就绪';
    } else {
      pill.className = 'status-pill bad';
      pill.textContent = '⚠️ ' + STATUS.issues.length + ' 项待处理';
    }
    if (showDetail) showStatusModal();
  } catch(e) {
    pill.className = 'status-pill bad';
    pill.textContent = '❌ 服务异常';
    if (showDetail) toast(e.message, 'err');
  }
}

function showStatusModal() {
  if (!STATUS) return;
  const s = STATUS;
  const pathRows = Object.entries(s.paths||{})
    .map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v?'<span class="badge ok">存在</span>':'<span class="badge bad">缺失</span>'}</td></tr>`)
    .join('');
  const issueHtml = (s.issues||[]).length
    ? `<div class="warnbox"><b>待处理项：</b><br>${s.issues.map(esc).join('<br>')}</div>` : '';
  openModal('环境自检', `
    ${issueHtml}
    <table>
      <tr><th>项目</th><th>值</th></tr>
      <tr><td>技能根目录</td><td class="mono">${esc(s.skill_root)}</td></tr>
      <tr><td>Python 解释器</td><td class="mono">${esc(s.python_exe)}</td></tr>
      <tr><td>Python 版本</td><td>${esc(s.python_version)}</td></tr>
      <tr><td>中医索引导入时间</td><td>${s.index_age_hours==null?'—':s.index_age_hours+' 小时前'}</td></tr>
      <tr><td>石师全文已抽取</td><td>${s.shixuemin_extracted?'<span class="badge ok">是</span>':'<span class="badge warn">否</span>'}</td></tr>
    </table>
    <h2 class="sec" style="margin-top:18px">目录检查</h2>
    <table>${pathRows}</table>
    <h2 class="sec" style="margin-top:18px">依赖自检输出</h2>
    <pre class="log">${esc(s.deps_output || '（无输出）')}</pre>
  `, `<button class="btn" onclick="closeModal()">关闭</button>`);
}

/* ============================================================
   页面 1 · 概览
   ============================================================ */
async function loadOverview() {
  const el = $('#tab-overview');
  el.innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
  let d;
  try { d = await API.overview(); }
  catch(e) { el.innerHTML = `<div class="card"><div class="empty">加载失败：${esc(e.message)}</div></div>`; return; }

  const order = ['中医教材','西医教材','倪海厦体系','石学敏体系','仓颉','蒸馏产出'];
  const cards = order.filter(k => d.libraries[k]).map(k => {
    const L = d.libraries[k];
    let extra = '';
    let acts = '';
    if (k === '中医教材' || k === '西医教材') {
      const track = k.replace('教材','');
      const catN = Object.keys(L.categories||{}).length;
      extra = `<div class="meta">类目 ${catN} 个 ｜ 索引 ${L.index_mtime || '无'}</div>`;
      acts = `<button class="btn sm" onclick="goTextbooks('${track}')">管理</button>
              <button class="btn sm" onclick="doRebuild('${track}')">重建索引</button>`;
    } else if (k === '石学敏体系') {
      extra = `<div class="meta">针灸全集已抽取：${L.extracted?'<span class="badge ok">是</span>':'<span class="badge warn">否</span>'}</div>`;
      acts = L.extracted ? '' : `<button class="btn sm pri" onclick="doExtractSXM()">抽取全文</button>`;
    } else if (k === '蒸馏产出') {
      extra = `<div class="meta">已安装 ${ (L.installed||[]).length } 个 ｜ 待蒸馏 ${ L.pending_tasks||0 } 个</div>`;
      acts = `<button class="btn sm pri" onclick="goTab('experts')">新建蒸馏任务</button>
              <button class="btn sm" onclick="goTab('outputs')">管理产物</button>`;
    } else {
      extra = `<div class="meta">${esc(L.path||'')}</div>`;
      acts = `<button class="btn sm" onclick="goTab('experts')">查看</button>`;
    }
    return `<div class="lib">
      <h3>${esc(k)}</h3>
      <div class="num">${L.files}<span>个文件</span></div>
      <div class="meta">${fmtSize(L.size)}</div>
      ${extra}
      <div class="acts">${acts}</div>
    </div>`;
  }).join('');

  const inst = (d.libraries['蒸馏产出']?.installed || []);
  const instHtml = inst.length ? `
    <h2 class="sec" style="margin-top:22px">已安装的专家体系
      <span class="sub">蒸馏产出 ${inst.length} 个</span></h2>
    <div class="grid c3">${inst.map(e => `
      <div class="lib">
        <h3>${esc(e.name)}</h3>
        <div class="meta">${e.files} 个文件 ｜ ${fmtSize(e.size)}</div>
        <div class="meta">${esc((e.desc||'').slice(0,80))}</div>
        <div class="acts">
          ${e.quality ? `<span class="badge ok">质检 ${e.quality.passed}/${e.quality.total}</span>` : ''}
          <button class="btn sm" onclick="viewFile('${esc(e.path)}\\SKILL.md')">查看 SKILL.md</button>
        </div>
      </div>`).join('')}</div>` : '';

  el.innerHTML = `
    <h2 class="sec">知识库概览 <span class="sub">技能根目录：${esc(d.skill_root)}</span></h2>
    <div class="grid c3">${cards}</div>
    ${instHtml}
    <h2 class="sec" style="margin-top:24px">快捷操作</h2>
    <div class="card">
      <div class="row">
        <button class="btn pri" onclick="goTab('experts')">＋ 新建蒸馏任务（上传素材）</button>
        <button class="btn" onclick="goTextbooks('中医')">上传中医教材</button>
        <button class="btn" onclick="goTextbooks('西医')">上传西医教材</button>
        <button class="btn" onclick="doRebuild('中医')">重建中医索引</button>
        <button class="btn" onclick="doRebuild('西医')">重建西医索引</button>
        <button class="btn" onclick="syncBook('西医')">同步西医（PDF 解析）</button>

/* ============================================================
   长任务轮询
   ============================================================ */
function pollTask(taskId, onDone) {
  const tick = async () => {
    try {
      const t = await API.task(taskId);
      if (t.status === 'running') {
        setTimeout(tick, 1600);
      } else {
        onDone(t);
        showTaskLog(t);
      }
    } catch(e) { onDone({status:'failed', stderr: e.message}); }
  };
  tick();
}

function showTaskLog(t) {
  openModal(`任务输出 · ${t.title || t.id}`, `
    <div class="row" style="margin-bottom:12px">
      <span class="badge ${t.status==='done'?'ok':'bad'}">${esc(t.status)}</span>
      <span class="badge">返回码 ${esc(t.returncode)}</span>
      <span class="badge">${esc(t.started_at)} → ${esc(t.ended_at||'')}</span>
    </div>
    <pre class="log">${esc(t.stdout || '（无标准输出）')}${t.stderr ? '\n\n[stderr]\n' + esc(t.stderr) : ''}</pre>
  `, `<button class="btn pri" onclick="closeModal()">关闭</button>`);
}

/* ---------- 上传 ---------- */
let UPLOAD_FILES = [];

function openUpload() {
  UPLOAD_FILES = [];
  openModal(`上传教材 · ${TB.track}`, `
    <div class="row" style="margin-bottom:14px">
      <div><label class="f">目标体系</label>
        <select id="upTrack">
          <option value="中医" ${TB.track==='中医'?'selected':''}>中医教材</option>
          <option value="西医" ${TB.track==='西医'?'selected':''}>西医教材</option>
        </select></div>
    </div>
    <div class="drop" id="dropZone">
      <b>拖拽文件到此处，或点击选择</b>
      支持 .pdf / .docx / .doc / .txt（单文件上限 500MB，可多选）
      <div class="files" id="fileList"></div>
    </div>
    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.doc,.txt" style="display:none">
    <label class="hint" style="display:block;margin-top:12px">
      <input type="checkbox" id="chkSync"> 上传后立即执行「同步解析」（PDF → txt，可能较慢，OCR 需数分钟）
    </label>
  `, `<button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" id="upOk">开始上传</button>`);

  const dz = $('#dropZone'), fi = $('#fileInput');
  dz.onclick = () => fi.click();
  fi.onchange = () => { addFiles(fi.files); fi.value = ''; };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); };
  $('#upOk').onclick = doUpload;
}

function addFiles(fl) {
  for (const f of fl) {
    if (!/\.(pdf|docx|doc|txt)$/i.test(f.name)) { toast(`跳过不支持的文件：${f.name}`, 'err'); continue; }
    if (!UPLOAD_FILES.some(x => x.name === f.name && x.size === f.size)) UPLOAD_FILES.push(f);
  }
  $('#fileList').innerHTML = UPLOAD_FILES.length
    ? UPLOAD_FILES.map(f => `· ${esc(f.name)}（${fmtSize(f.size)}）`).join('<br>') : '';
}

async function doUpload() {
  if (!UPLOAD_FILES.length) { toast('请先选择文件', 'err'); return; }
  const track = $('#upTrack').value;
  const fd = new FormData();
  fd.append('track', track);
  UPLOAD_FILES.forEach(f => fd.append('file', f, f.name));
  const btn = $('#upOk');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>上传中…';
  try {
    const r = await fetch('/api/upload', {method:'POST', body: fd}).then(x => x.json());
    if (!r.ok) throw new Error(r.error);
    const d = r.data;
    closeModal();
    toast(`成功上传 ${d.uploaded.length} 个文件` +
          (d.failed.length ? `，${d.failed.length} 个失败` : ''), 'ok');
    TB.track = track; TB.page = 1;
    loadTextbooks(); loadOverview();
    if ($('#chkSync') && $('#chkSync').checked) syncBook(track);
  } catch(e) {
    toast(e.message, 'err');
    btn.disabled = false; btn.textContent = '开始上传';
  }
}

async function syncBook(track) {
  try {
    const r = await API.sync({ track });
    toast(`已启动 ${track} 同步解析任务…`);
    pollTask(r.task_id, (t) => {
      toast(t.status === 'done' ? `${track} 同步完成` : '同步失败',
            t.status === 'done' ? 'ok' : 'err');
      loadOverview();
      if ($('#tab-textbooks').classList.contains('active')) loadTextbooks();
    });
  } catch(e) { toast(e.message, 'err'); }
}

function loadSearch() {
  $('#tab-search').innerHTML = `

  $('#seTrack').value = SE.track;
  syncSourceOptions();
  if (SE.keyword) runSearch();

function syncSourceOptions() {
  const track = $('#seTrack').value;
  const opts = track === '西医'
    ? [['textbook','仅教材']]
    : [['all','跨库（教材+倪师+石师+蒸馏产出）'],['textbook','仅教材'],
       ['nihaixia','仅倪海厦体系'],['shixuemin','仅石学敏体系'],['distilled','仅蒸馏产出']];
  $('#seSource').innerHTML = opts.map(([v,l]) =>
    `<option value="${v}">${l}</option>`).join('');
  $('#seSource').value = opts.some(o => o[0] === SE.source) ? SE.source : opts[0][0];
}

async function runSearch() {
  const kw = $('#seKw').value.trim();
  if (!kw) { toast('请输入关键词', 'err'); return; }
  SE.keyword = kw;
  SE_SHOW_ALL = false;
  SE.track = $('#seTrack').value;
  SE.source = $('#seSource').value;
  SE.category = $('#seCat').value.trim();
  SE.context = $('#seCtx').value.trim() || '6';
  SE.max_hits = $('#seMax').value.trim() || '20';

  const el = $('#seResult');
  el.innerHTML = '<div class="card"><div class="empty"><span class="spin" style="border-color:rgba(26,74,58,.3);border-top-color:#1a4a3a"></span>检索中，跨库检索可能需要数秒…</div></div>';
  try {
    const d = await API.search({
      keyword: SE.keyword, track: SE.track, source: SE.source,
      category: SE.category, context: SE.context, max_hits: SE.max_hits,
    });
    renderSearch(d);
  } catch(e) {
    el.innerHTML = `<div class="card"><div class="empty">检索失败：${esc(e.message)}</div></div>`;
  }
}

function renderSearch(d) {
  const rs = d.results || [];
  if (!rs.length) {
    $('#seResult').innerHTML = `<div class="card"><div class="empty">
      未命中「${esc((d.keywords||[]).join('、'))}」，可换个关键词或调整「来源」</div></div>`;
    return;
  }
  const kws = d.keywords || [];
  const hi = s => {
    let out = esc(s);
    kws.forEach(k => {
      if (!k) return;
      const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
      out = out.replace(re, m => `<mark>${m}</mark>`);
    });
    return out;
  };
  // 命中文件可能上千，默认只渲染前 50 个，其余按需展开（避免 DOM 过重）
  const RENDER_LIMIT = 50;
  const shown = SE_SHOW_ALL ? rs : rs.slice(0, RENDER_LIMIT);
  window.__SE_DATA = d;
  const cards = shown.map((r, i) => {
    const hits = (r.hits||[]).map(h => `
      <div class="hit">
        <div class="hl">[${esc(h.keyword)} · 第 ${esc(h.line)} 行]</div>
        <pre>${hi(h.snippet)}</pre>
      </div>`).join('');
    return `<div class="res ${i===0?'open':''}">
      <div class="rh" onclick="this.parentNode.classList.toggle('open')">
        <b>📄 ${esc(r.file)}${r.source ? ` <span class="badge">${esc(r.source)}</span>` : ''}</b>
        <span class="badge info">${(r.hits||[]).length} 处命中</span>
      </div>
      <div class="rb">${hits||'<div class="empty">无</div>'}</div>
    </div>`;
  }).join('');

  // stats 为 [[文件名, 命中数, 来源], ...]
  const statList = Array.isArray(d.stats) ? d.stats : [];
  const more = (rs.length > RENDER_LIMIT && !SE_SHOW_ALL)
    ? `<div style="text-align:center;margin-top:14px">
         <button class="btn pri" onclick="SE_SHOW_ALL=true;renderSearch(window.__SE_DATA)">
           显示其余 ${rs.length - RENDER_LIMIT} 个文件</button>
       </div>` : '';
  $('#seResult').innerHTML = `
    <div class="hint" style="margin-bottom:11px">
      关键词 <b>${esc(kws.join('、'))}</b> ｜ 来源 <code>${esc(d.source)}</code> ｜
      命中 <b>${statList.length}</b> 个文件${rs.length > RENDER_LIMIT && !SE_SHOW_ALL
        ? `（默认展开前 ${RENDER_LIMIT} 个）` : ''}
    </div>
    ${cards}${more}`;
}

    `, `<button class="btn" onclick="closeModal()">关闭</button>

function openImport() {

  dz.ondragleave = () => dz.classList.remove('over');

    chosen = e.dataTransfer.files[0]; if (chosen) $('#impFile').textContent = '· ' + chosen.name; };
  $('#impOk').onclick = async () => {
    if (!chosen) { toast('请先选择 .zip 文件', 'err'); return; }
    const fd = new FormData(); fd.append('file', chosen, chosen.name);
    try {
      const r = await fetch('/api/distill/import', {method:'POST', body: fd}).then(x => x.json());
      if (!r.ok) throw new Error(r.error);

        <h2 class="sec" style="margin-top:14px">顶层条目</h2>
        <pre class="code">${esc((d.tops||[]).join('\n') || '（无）')}</pre>
        <h2 class="sec" style="margin-top:14px">检测到 SKILL.md 的目录（候选）</h2>
        <pre class="code">${esc((d.candidates||[]).join('\n') || '（未找到 SKILL.md）')}</pre>
        <div class="hint" style="margin-top:10px">

        </div>

async function loadExperts() {
  const el = $('#tab-experts');
  el.innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
  let d;
  try { d = await API.experts(); }
  catch(e) { el.innerHTML = `<div class="card"><div class="empty">加载失败：${esc(e.message)}</div></div>`; return; }

  const card = (key, icon, desc, extra='') => {
    const E = d[key] || {};
    return `<div class="lib">
      <h3>${icon} ${esc(E.name||key)}</h3>
      <div class="num">${(E.files||[]).length}<span>个文件</span></div>
      <div class="meta">${esc(desc)}</div>
      ${extra}
      <div class="acts">
        ${E.skill_md ? `<button class="btn sm" onclick="viewFile('${esc(E.skill_md)}')">查看 SKILL.md</button>` : ''}
      </div>
    </div>`;
  };

  const inst = (d.distilled||{}).installed || [];
  const pend = (d.distilled||{}).pending_tasks || [];

  el.innerHTML = `
    <h2 class="sec">专家体系</h2>
    <div class="grid c3">
      ${card('nihaixia','🀄','经方体系：14 模块 + 1257 医案 + 蒸馏速查')}
      ${card('shixuemin','🪡','针灸体系：醒脑开窍 / 手法量学 / 十二经病候',
        (d.shixuemin||{}).extracted

          : '<div class="meta"><span class="badge warn">针灸全集未抽取</span></div>'+
            '<div class="acts"><button class="btn sm pri" onclick="doExtractSXM()">抽取全文</button></div>')}
      ${card('cangjie','⚙️','元 Skill：7 步蒸馏流程 + 质检 + prompt 编译器')}
    </div>

    <h2 class="sec" style="margin-top:26px">★ 新建蒸馏任务
      <span class="sub">上传素材 → 自动生成指令卡 → 复制到 TRAE 执行</span></h2>
    <div class="card">
      <div class="warnbox">
        仓颉蒸馏必须由 AI 参与：工作台负责「上传素材 + 生成指令卡 + 检测产物 + 质检 + 安装」，
        真正的 7 步蒸馏在 TRAE 中执行（复制指令卡粘贴即可）。
      </div>
      <div class="row" style="margin-bottom:12px">
        <div><label class="f">蒸馏类型</label>
          <select id="dtType">
            <option value="A">A 类 · 人物蒸馏（某位医家/学者）</option>
            <option value="B">B 类 · 教材蒸馏（某本教材/讲稿）</option>
          </select></div>
        <div style="flex:1;min-width:200px"><label class="f">对象名（必填，将作为产出目录名）</label>
          <input type="text" id="dtPerson" placeholder="如：张三丰 或 中医内科学讲稿" style="width:100%"></div>
        <div style="flex:1;min-width:200px"><label class="f">聚焦方向（可选）</label>
          <input type="text" id="dtFocus" placeholder="如：经方运用与六经辨证" style="width:100%"></div>
      </div>
      <div class="drop" id="dtDrop">
        <b>拖拽素材到此处，或点击选择</b>
        支持 .pdf / .docx / .doc / .txt / .md / .epub（可多文件，单文件上限 200MB）

      ${inst.length ? inst.map(e => `
        <div class="lib">
          <h3>${esc(e.name)}</h3>
          <div class="meta">${e.files} 个文件 ｜ ${fmtSize(e.size)}</div>
          <div class="meta">${esc((e.desc||'').slice(0,80))}</div>
          <div class="acts">

  dz.onclick = () => fi.click();
  fi.onchange = () => { addDT(fi.files); fi.value = ''; };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); addDT(e.dataTransfer.files); };
  function addDT(fl) {
    for (const f of fl) {
      if (!/\.(pdf|docx|doc|txt|md|epub)$/i.test(f.name)) { toast(`跳过不支持：${f.name}`, 'err'); continue; }
      if (!files.some(x => x.name === f.name && x.size === f.size)) files.push(f);
    }
    window.__DT_FILES = files;
    $('#dtFiles').innerHTML = files.length
      ? files.map(f => `· ${esc(f.name)}（${fmtSize(f.size)}）`).join('<br>') : '';
  }
  $('#dtOk').onclick = createDistillTask;
}

async function createDistillTask() {
  const person = $('#dtPerson').value.trim();
  if (!person) { toast('请填写对象名', 'err'); return; }
  const files = window.__DT_FILES || [];
  if (!files.length) { toast('请至少上传一个素材文件', 'err'); return; }

  const fd = new FormData();
  fd.append('person', person);
  fd.append('distill_type', $('#dtType').value);
  fd.append('focus', $('#dtFocus').value.trim());
  files.forEach(f => fd.append('file', f, f.name));

  const btn = $('#dtOk');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>处理中…';
  try {
    const r = await fetch('/api/distill/task', {method:'POST', body: fd}).then(x => x.json());
    if (!r.ok) throw new Error(r.error);
    const d = r.data;
    toast('蒸馏任务已创建，指令卡已生成', 'ok');
    showPromptData(d.slug, d.prompt);
    window.__DT_FILES = [];
    $('#dtFiles').innerHTML = '';
    loadExperts();
  } catch(e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '创建蒸馏任务';
  }
}

function showPromptData(slug, prompt) {
  openModal('蒸馏指令卡已生成 · ' + slug, `
    <div class="warnbox">
      <b>下一步：</b>点「复制全部」→ 打开 TRAE → 粘贴发送。
      AI 会按仓颉 7 步流程读取素材并完成蒸馏，产出后回到「技能产物」页点「检测产物」→「质检」→「安装」。
    </div>
    <pre class="code" id="promptText">${esc(prompt)}</pre>
  `, `<button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn pri" id="cpBtn">复制全部</button>`);
  $('#cpBtn').onclick = async () => {
    const txt = $('#promptText').textContent;
    try { await navigator.clipboard.writeText(txt); toast('已复制到剪贴板','ok'); }
    catch(e) {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast('已复制到剪贴板','ok');
    }
  };
}

/* ============================================================
   Tab 切换
   ============================================================ */
function goTab(name) {
  $$('.tab').forEach(t => t.classList.remove('active'));
  $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  const sec = $('#tab-' + name);
  if (sec) sec.classList.add('active');
  const loaders = {
    overview: loadOverview, textbooks: loadTextbooks, search: loadSearch,
    outputs: loadOutputs, experts: loadExperts, guide: loadGuide,
  };
  (loaders[name] || (()=>{}))();
  window.scrollTo({top:0, behavior:'smooth'});
}

$$('.tabs button').forEach(b => b.onclick = () => goTab(b.dataset.tab));

document.addEventListener('DOMContentLoaded', async () => {
  await refreshStatus(false);
  await loadOverview();
});
