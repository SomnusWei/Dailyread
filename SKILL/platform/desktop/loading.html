<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>医学综合 · 个人工作台</title>
<style>
  :root{ --primary:#1a4a3a; --primary-l:#2a6e52; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
    background:#f5f7f6;color:#1f2d28;
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-app-region:drag;
  }
  .wrap{text-align:center}
  .logo{
    width:74px;height:74px;margin:0 auto 20px;border-radius:18px;
    background:linear-gradient(145deg,var(--primary-l),var(--primary));
    color:#fff;font-size:36px;font-weight:700;line-height:74px;
    box-shadow:0 8px 26px rgba(26,74,58,.28);
  }
  h1{font-size:17px;font-weight:600;color:var(--primary);letter-spacing:.5px}
  p.sub{font-size:12.5px;color:#6b7d76;margin-top:7px}
  .bar{
    width:220px;height:5px;margin:24px auto 0;border-radius:3px;
    background:#e2e8e5;overflow:hidden;
  }
  .bar i{
    display:block;width:40%;height:100%;border-radius:3px;
    background:var(--primary-l);
    animation:slide 1.15s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-105%)}
    100%{transform:translateX(255%)}
  }
  .tip{font-size:12px;color:#8c9c95;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">医</div>
    <h1>医学综合 · 个人工作台</h1>
    <p class="sub">正在启动本地服务…</p>
    <div class="bar"><i></i></div>
    <div class="tip">首次启动需定位技能目录，可能需要几秒</div>
  </div>
</body>
</html>
