<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · DailyRead</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-layout {
      display: flex;
      min-height: 100vh;
      padding-top: 64px;
    }
    .admin-sidebar {
      width: 220px;
      background: var(--bg-dark);
      color: white;
      padding: 24px 0;
      position: fixed;
      top: 64px;
      bottom: 0;
      left: 0;
    }
    .admin-sidebar h3 {
      padding: 0 24px 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .admin-sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      transition: all var(--transition);
      border-left: 3px solid transparent;
    }
    .admin-sidebar .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }
    .admin-sidebar .nav-item.active {
      background: rgba(25, 118, 210, 0.15);
      color: white;
      border-left-color: var(--primary);
    }
    .admin-sidebar .nav-icon {
      font-size: 18px;
      width: 20px;
      text-align: center;
    }
    .admin-main {
      flex: 1;
      margin-left: 220px;
      padding: 32px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .admin-header h1 {
      font-size: 24px;
      font-weight: 700;
    }
    .admin-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-user-info {
      text-align: right;
    }
    .admin-user-info .name {
      font-weight: 600;
      font-size: 14px;
    }
    .admin-user-info .role {
      font-size: 12px;
      color: var(--text-muted);
    }
    .admin-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
    }
    .logout-btn {
      padding: 6px 12px;
      font-size: 13px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .logout-btn:hover {
      border-color: var(--error);
      color: var(--error);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border-light);
    }
    .stat-card .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-card:nth-child(2) .stat-value { color: #764ba2; }
    .stat-card:nth-child(3) .stat-value { color: #43e97b; }
    .stat-card:nth-child(4) .stat-value { color: #4facfe; }
    .stat-card:nth-child(5) .stat-value { color: #fa709a; }
    .stat-card:nth-child(6) .stat-value { color: #ffc107; }
    .content-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      overflow: hidden;
    }
    .content-card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content-card-header h2 {
      font-size: 18px;
      font-weight: 700;
    }
    .content-card-body {
      padding: 24px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border-light);
    }
    .admin-table td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-light);
    }
    .admin-table tr:last-child td {
      border-bottom: none;
    }
    .admin-table tr:hover {
      background: var(--bg-alt);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-admin {
      background: rgba(244, 67, 54, 0.1);
      color: var(--error);
    }
    .badge-user {
      background: rgba(25, 118, 210, 0.1);
      color: var(--primary);
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 32px;
      width: 400px;
      max-width: 90%;
    }
    .modal h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 768px) {
      .admin-sidebar {
        display: none;
      }
      .admin-main {
        margin-left: 0;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <span class="brand-icon">📖</span>
        <span class="brand-text">DailyRead</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">返回首页</a>
        <button class="logout-btn" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h3>管理</h3>
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">📊</span>
        <span>数据统计</span>
      </a>
      <a href="#" class="nav-item" data-page="users">
        <span class="nav-icon">👥</span>
        <span>用户管理</span>
      </a>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1 id="pageTitle">数据统计</h1>
        <div class="admin-user">
          <div class="admin-user-info">
            <div class="name" id="adminName">管理员</div>
            <div class="role">admin</div>
          </div>
          <div class="admin-avatar" id="adminAvatar">A</div>
        </div>
      </div>

      <!-- Dashboard Page -->
      <div id="dashboardPage">
        <div class="stats-grid" id="statsGrid">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <!-- Users Page -->
      <div id="usersPage" class="hidden">
        <div class="content-card">
          <div class="content-card-header">
            <h2>用户列表</h2>
            <button class="btn btn-primary btn-sm" id="addUserBtn">+ 添加用户</button>
          </div>
          <div class="content-card-body">
            <div id="usersList">
              <div class="loading">加载中...</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add User Modal -->
  <div class="modal-overlay hidden" id="addUserModal">
    <div class="modal">
      <h3>添加用户</h3>
      <form id="addUserForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="newUsername" required minlength="3" maxlength="32">
        </div>
        <div class="form-group">
          <label>昵称 (可选)</label>
          <input type="text" id="newNickname" maxlength="64">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="newPassword" required minlength="6" maxlength="64">
        </div>
        <div class="form-group">
          <label>角色</label>
          <select id="newRole" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="cancelAddUser">取消</button>
          <button type="submit" class="btn btn-primary">创建</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
