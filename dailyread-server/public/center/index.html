<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>登录 · 炎武班学习中心</title>
  <meta name="theme-color" content="#667eea">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lc-login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .lc-login-card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .lc-login-header { text-align: center; margin-bottom: 32px; }
    .lc-login-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: white;
    }
    .lc-login-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .lc-login-subtitle { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    .lc-login-form .form-group { margin-bottom: 20px; }
    .lc-login-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      transition: all var(--transition);
      box-sizing: border-box;
      background: var(--bg);
    }
    .lc-login-form input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
    }
    .lc-login-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      margin-top: 8px;
    }
    .lc-login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4); }
    .lc-login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .lc-error {
      background: rgba(244, 67, 54, 0.1);
      color: var(--error);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .lc-error.show { display: block; }
    .lc-hint {
      margin-top: 20px;
      padding: 12px 16px;
      background: rgba(102, 126, 234, 0.08);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .lc-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
    .lc-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="lc-login-page">
    <div class="lc-login-card">
      <div class="lc-login-header">
        <div class="lc-login-icon">🎓</div>
        <h1 class="lc-login-title">炎武班 · 学习中心</h1>
        <p class="lc-login-subtitle">讲义分发 · 作业布置 · 消息通知</p>
      </div>

      <form class="lc-login-form" id="loginForm" novalidate>
        <div class="lc-error" id="loginError"></div>

        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" placeholder="请输入账号" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>

        <button type="submit" class="lc-login-btn" id="loginBtn">登 录</button>
      </form>

      <div class="lc-hint">
        本中心不提供公开注册，账号由管理员统一创建并分发。如需开通，请联系管理员。
      </div>

      <div class="lc-footer">
        <a href="/">← 返回网站首页</a>
      </div>
    </div>
  </div>

  <script src="/center/js/login.js"></script>
</body>
</html>
