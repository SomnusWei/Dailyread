server {
    listen 80;
    server_name dailyread.sonnusww.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dailyread.sonnusww.top;

    ssl_certificate /etc/letsencrypt/live/dailyread.sonnusww.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dailyread.sonnusww.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # 所有其他请求（包括首页、注册页、静态文件）代理到后端
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
